default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "portfolio_api_development" } %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "portfolio_api_test" } %>

production:
  primary: &primary_production
    <<: *default
    database: portfolio_api_production
    username: portfolio_api
    password: <%= ENV["PORTFOLIO_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: portfolio_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: portfolio_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: portfolio_api_production_cable
    migrations_paths: db/cable_migrate
